# Texts of the web pages. Values are java.text.MessageFormat patterns: write a literal apostrophe as ''.
# To add a language, copy this file to messages_<language>.properties and translate the values;
# keys you leave out fall back to this file.
#
# Gramps types (event.*, role.*, family.*, child.*, name.*, attribute.*, note.*) are keyed by the English
# Gramps name in lower case with other characters replaced by _. English needs no entries: an untranslated
# type is shown as written in Gramps, which also covers custom types.
#
# Texts about a person may have gender-specific variants for languages that need them, such as
# summary.born.female; see Ui.t(String, Gender, Object...).

