# Date display texts. Values are java.text.MessageFormat patterns: write a literal apostrophe as ''.
# To add a language, copy this file to messages_<language>.properties and translate the values;
# keys you leave out fall back to this file.

date.before=before {0}
date.after=after {0}
date.about=about {0}
date.from=from {0}
date.to=to {0}
date.range=between {0} and {1}
date.span=from {0} to {1}
date.estimated=estimated {0}
date.calculated=calculated {0}
# {1} is the calendar name and/or the new-year day
date.extras={0} ({1})

# ICU date skeletons: y = year, M = month (MMMM = full name), d = day. ICU picks the locale's order.
skeleton.ymd=yMMMMd
skeleton.ym=yMMMM
skeleton.y=y
skeleton.md=MMMMd
skeleton.m=MMMM

calendar.gregorian=Gregorian
calendar.julian=Julian
calendar.hebrew=Hebrew
calendar.french_republican=French Republican
calendar.persian=Persian
calendar.islamic=Islamic
calendar.swedish=Swedish

# ICU has no French Republican calendar. {0} year, {1} month, {2} day.
calendar.french_republican.months=Vendémiaire, Brumaire, Frimaire, Nivôse, Pluviôse, Ventôse, Germinal, Floréal, Prairial, Messidor, Thermidor, Fructidor, Extra
french_republican.ymd={2} {1} an {0}
french_republican.ym={1} an {0}
french_republican.y=an {0}
